org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation aborts on Windows when the project and the
# Pub cache are on different drives ("different roots").
kotlin.incremental=false
# tflite_flutter compiles its Java for JVM 11 while Kotlin targets 17; newer Kotlin Gradle
# plugins fail the build on that mismatch. Downgrade the check to a warning (bytecode is fine).
kotlin.jvm.target.validation.mode=warning
